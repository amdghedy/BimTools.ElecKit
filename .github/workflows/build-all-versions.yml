name: Build all Revit versions and installer

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Revit ${{ matrix.revit }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        revit: ["2020", "2021", "2022", "2023", "2024", "2025", "2026", "2027"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Apply ElementId API compatibility for Revit 2024+
        if: ${{ matrix.revit >= 2024 }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Get-ChildItem 'src' -Filter '*.cs' -Recurse |
            Where-Object { $_.Name -ne 'AssignWorksetCommand.cs' } |
            ForEach-Object {
              $original = Get-Content $_.FullName -Raw
              $updated = $original -replace '\\.IntegerValue', '.Value'
              if ($updated -ne $original) { Set-Content -Path $_.FullName -Value $updated -NoNewline -Encoding utf8 }
            }
          # WorksetId intentionally retains IntegerValue in older APIs; migrate only ElementId expressions.
          $worksetFile = 'src/Commands/AssignWorksetCommand.cs'
          $worksetSource = Get-Content $worksetFile -Raw
          $worksetUpdated = $worksetSource.Replace('e.Id.IntegerValue', 'e.Id.Value').Replace('p.AsElementId().IntegerValue', 'p.AsElementId().Value')
          if ($worksetUpdated -ne $worksetSource) { Set-Content -Path $worksetFile -Value $worksetUpdated -NoNewline -Encoding utf8 }
      - name: Restore
        run: dotnet restore ElecKit.csproj -p:RevitVersion=${{ matrix.revit }}
      - name: Build version-specific add-in
        run: dotnet build ElecKit.csproj -c Release --no-restore -p:RevitVersion=${{ matrix.revit }} -p:OutputPath=RevitVersions/Revit${{ matrix.revit }}/
      - name: Stage manifest and verify package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = "RevitVersions/Revit${{ matrix.revit }}"
          if (!(Test-Path "$dir/ElecKit.dll")) { throw "Build output missing: $dir/ElecKit.dll" }
          Copy-Item "ElecKit.addin" "$dir/ElecKit.addin" -Force
          $manifest = [xml](Get-Content "$dir/ElecKit.addin" -Raw)
          $assembly = [string]$manifest.RevitAddIns.AddIn.Assembly
          if ($assembly -ne 'ElecKit\ElecKit.dll') { throw "Unexpected manifest Assembly path: $assembly" }
          Get-FileHash "$dir/ElecKit.dll" -Algorithm SHA256 | Format-List
      - uses: actions/upload-artifact@v4
        with:
          name: ElecKit-Revit-${{ matrix.revit }}
          path: RevitVersions/Revit${{ matrix.revit }}/*
          if-no-files-found: error
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Test Revit-independent logic
        run: dotnet test tests/ElecKit.Tests/ElecKit.Tests.csproj -c Release
  installer:
    name: Package selectable-version setup EXE
    runs-on: windows-latest
    needs: [build, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: ElecKit-Revit-*
          path: OtherFiles
          merge-multiple: false
      - name: Normalize artifact folders
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($v in 2020..2027) {
            $source = "OtherFiles/ElecKit-Revit-$v"
            $dest = "RevitVersions/Revit$v"
            if (!(Test-Path "$source/ElecKit.dll")) { throw "Missing build artifact for Revit $v." }
            if (!(Test-Path "$source/ElecKit.addin")) { throw "Missing manifest for Revit $v." }
            New-Item -ItemType Directory -Force -Path $dest | Out-Null
            Copy-Item "$source/*" $dest -Force
          }
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: Compile installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $iscc = Join-Path $env:ProgramFiles 'Inno Setup 6/ISCC.exe'
          if (!(Test-Path $iscc)) { throw "Inno Setup compiler not found: $iscc" }
          & $iscc "EXE/ElecKit.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }
          if (!(Test-Path 'EXE/dist/ElecKit-Setup.exe')) { throw 'Installer EXE was not created.' }
      - uses: actions/upload-artifact@v4
        with:
          name: ElecKit-Setup-EXE
          path: EXE/dist/ElecKit-Setup.exe
          if-no-files-found: error
