name: Build
on: [push, pull_request]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build
        run: dotnet build ElecKit.csproj -c Release
      - name: Test Revit-independent logic
        run: dotnet test tests/ElecKit.Tests/ElecKit.Tests.csproj -c Release
      - uses: actions/upload-artifact@v4
        with:
          name: ElecKit-Release
          path: bin/Release/net47/**
